version: v2
managed:
  enabled: true
plugins:
  # Go: サーバーとメッセージ
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen
    opt: paths=source_relative
  # TypeScript: BFF から呼ぶクライアント
  - remote: buf.build/bufbuild/es
    out: services/bff/src/gen
    opt: target=ts
