apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkshort
  labels:
    app: linkshort
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkshort
  template:
    metadata:
      labels:
        app: linkshort
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: linkshort:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADDR
              value: ":8080"
          # 落ちていたら再起動する。重い依存を見に行かせないこと
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # 受け入れ準備ができたらトラフィックを流す。失敗しても再起動はしない
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            # requests はスケジューラが置き場所を決める基準、limits は上限
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      # SIGTERM 後にロードバランサから外れる猶予を取る
      terminationGracePeriodSeconds: 30
